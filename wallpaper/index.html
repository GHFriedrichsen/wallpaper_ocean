<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocean Cube</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: fixed;
      min-width: 220px;
      padding: 14px 18px;
      border-radius: 14px;
      color: #fff;
      background: rgba(10, 20, 35, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .topleft { top: 40px; left: 40px; }
    .topright { top: 40px; right: 40px; }
    .bottomleft { bottom: 70px; left: 40px; }
    .bottomright { bottom: 70px; right: 40px; }
    .hud-top { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; opacity: 0.85; }
    .hud-main { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
    .hud-icon { font-size: 26px; }
    .hud-temp { font-size: 34px; font-weight: 300; }
    .hud-cond { font-size: 15px; opacity: 0.9; }
    .hud-details { margin-top: 4px; font-size: 12px; opacity: 0.7; }
    .status {
      position: fixed;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .status.topleft, .status.topright { top: 12px; }
    .status.bottomleft, .status.bottomright { bottom: 40px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud" class="hud topleft"></div>
  <div id="status" class="status topleft" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
