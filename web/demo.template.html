<title>Ocean Cube</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap">
<style>
  /* Full-bleed WebGL scene with a glass control sheet docked at the bottom. Single dark look on purpose. */
  :root {
    --ink: #f2f7fb;
    --ink-dim: #a9bccb;
    --glass: rgba(8, 18, 30, 0.55);
    --glass-edge: rgba(190, 225, 245, 0.16);
    --chip: rgba(255, 255, 255, 0.07);
    --chip-on: #7fe0e6;
    --chip-on-ink: #04212a;
    --abyss: #05080f;
    --font-ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--abyss);
    color: var(--ink);
    font-family: var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud, #status { position: fixed; pointer-events: none; }
  #status {
    top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    padding: 6px 12px; border-radius: 8px; font-size: 12px; background: var(--glass);
  }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-top: 12px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, rgba(5, 8, 15, 0.75), rgba(5, 8, 15, 0));
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .panel {
    width: 100%; max-width: 720px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    border-radius: 18px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 12px 0 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .row { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .label {
    padding-inline: 14px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim);
  }
  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px 4px;
    scrollbar-width: none; scroll-snap-type: x proximity;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; scroll-snap-align: start;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px; border-radius: 999px;
    border: 1px solid var(--glass-edge); background: var(--chip); color: var(--ink);
    font: 600 14px/1 var(--font-ui); cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .chip .ico { font-size: 16px; }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .chip:focus-visible, .toggle:focus-visible { outline: 2px solid var(--chip-on); outline-offset: 2px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-inline: 14px; }
  .hint { font-size: 12px; color: var(--ink-dim); }
  .toggle {
    flex: none; border: 1px solid var(--glass-edge); background: var(--chip); color: var(--ink);
    font: 600 13px/1 var(--font-ui); padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .sheet.collapsed { background: none; align-items: flex-end; }
  @media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>

<canvas id="scene"></canvas>
<div id="hud" hidden></div>
<div id="status" hidden></div>

<div class="sheet" id="sheet">
  <div class="panel" id="panel">
    <div class="row">
      <span class="label" id="lbl-weather">Weather</span>
      <div class="chips" id="weather" role="group" aria-labelledby="lbl-weather"></div>
    </div>
    <div class="row">
      <span class="label" id="lbl-time">Time of day</span>
      <div class="chips" id="time" role="group" aria-labelledby="lbl-time"></div>
    </div>
    <div class="foot">
      <span class="hint" id="hint">Touch the water to make ripples</span>
      <button class="toggle" id="hide" type="button">Hide</button>
    </div>
  </div>
  <button class="toggle" id="show" type="button" hidden>Weather</button>
</div>

<script>
  (function () {
    var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    var T = {
      en: { weather: 'Weather', time: 'Time of day', hint: 'Touch the water to make ripples', hide: 'Hide', show: 'Weather',
        clear: 'Clear', partly: 'Partly cloudy', cloudy: 'Overcast', rain: 'Rain', storm: 'Storm', snow: 'Snow', fog: 'Fog', windy: 'Windy',
        auto: 'Now', dawn: 'Dawn', day: 'Day', dusk: 'Dusk', night: 'Night' },
      pt: { weather: 'Clima', time: 'Hora do dia', hint: 'Toque na água para criar ondulações', hide: 'Ocultar', show: 'Clima',
        clear: 'Céu limpo', partly: 'Parcialmente nublado', cloudy: 'Nublado', rain: 'Chuva', storm: 'Tempestade', snow: 'Neve', fog: 'Neblina', windy: 'Ventania',
        auto: 'Agora', dawn: 'Amanhecer', day: 'Dia', dusk: 'Entardecer', night: 'Noite' },
      es: { weather: 'Clima', time: 'Hora del día', hint: 'Toca el agua para crear ondas', hide: 'Ocultar', show: 'Clima',
        clear: 'Despejado', partly: 'Parcialmente nublado', cloudy: 'Nublado', rain: 'Lluvia', storm: 'Tormenta', snow: 'Nieve', fog: 'Niebla', windy: 'Ventoso',
        auto: 'Ahora', dawn: 'Amanecer', day: 'Día', dusk: 'Atardecer', night: 'Noche' }
    };
    var t = T[lang] || T.en;
    var WEATHER = [['clear', '☀️'], ['partly', '⛅'], ['cloudy', '☁️'], ['rain', '🌧️'], ['storm', '⛈️'], ['windy', '💨'], ['fog', '🌫️'], ['snow', '❄️']];
    var TIME = [['auto', '🕒'], ['dawn', '🌅'], ['day', '🌞'], ['dusk', '🌇'], ['night', '🌙']];

    var saved = {};
    try { saved = JSON.parse(localStorage.getItem('ocean-cube-demo') || '{}'); } catch (e) { saved = {}; }
    var state = { weatheroverride: saved.weatheroverride || 'partly', timeoverride: saved.timeoverride || 'auto' };

    // No network in this page: weather comes from the buttons, time of day from this device's clock.
    window.OCEAN_CUBE_DEFAULTS = { city: '', showhud: false, weatheroverride: state.weatheroverride, timeoverride: state.timeoverride };

    document.getElementById('lbl-weather').textContent = t.weather;
    document.getElementById('lbl-time').textContent = t.time;
    document.getElementById('hint').textContent = t.hint;
    document.getElementById('hide').textContent = t.hide;
    document.getElementById('show').textContent = t.show;

    function build(containerId, items, key) {
      var box = document.getElementById(containerId);
      items.forEach(function (item) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.id = key + '-' + item[0];
        b.dataset.value = item[0];
        b.innerHTML = '<span class="ico" aria-hidden="true">' + item[1] + '</span><span></span>';
        b.lastChild.textContent = t[item[0]];
        b.setAttribute('aria-pressed', String(state[key] === item[0]));
        b.addEventListener('click', function () {
          state[key] = item[0];
          box.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); });
          var props = {};
          props[key] = { value: item[0] };
          if (window.wallpaperPropertyListener) window.wallpaperPropertyListener.applyUserProperties(props);
          try { localStorage.setItem('ocean-cube-demo', JSON.stringify(state)); } catch (e) { /* optional */ }
        });
        box.appendChild(b);
      });
    }
    build('weather', WEATHER, 'weatheroverride');
    build('time', TIME, 'timeoverride');

    var sheet = document.getElementById('sheet');
    document.getElementById('hide').addEventListener('click', function () {
      document.getElementById('panel').hidden = true;
      document.getElementById('show').hidden = false;
      sheet.classList.add('collapsed');
    });
    document.getElementById('show').addEventListener('click', function () {
      document.getElementById('panel').hidden = false;
      document.getElementById('show').hidden = true;
      sheet.classList.remove('collapsed');
    });
  })();
</script>
<!-- APP_JS -->
